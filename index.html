<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Drift</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b18;color:#eafcff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(960px,96vw)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:8px 0;color:#5df6ff;text-shadow:0 0 18px #00d9ff}button{background:#5df6ff;color:#07101a;border:0;border-radius:9px;padding:10px 16px;font-weight:800;cursor:pointer}canvas{width:100%;max-height:72vh;background:#101a27;border:2px solid #1d6172;border-radius:14px;display:block}p{color:#a8cbd5}kbd{background:#203446;padding:2px 6px;border-radius:4px}
</style></head><body><main><header><h1>⚡ NEON DRIFT</h1><div>Score: <b id="score">0</b> · Best: <b id="best">0</b> <button id="start">Start / Restart</button></div></header><canvas id="game" width="900" height="560"></canvas><p>Controls: <kbd>←</kbd> <kbd>→</kbd> steer · <kbd>↑</kbd> boost · avoid traffic, collect cyan orbs. On mobile, tap the left/right half to steer.</p></main><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let keys={},player,things,score,best=+(localStorage.ndBest||0),running=false,over=false,frame=0,speed=4;bestEl.textContent=best;
function reset(){player={x:450,y:455,w:38,h:62};things=[];score=0;speed=4;frame=0;over=false;running=true;scoreEl.textContent=0;loop()}
document.querySelector('#start').onclick=reset;onkeydown=e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault()};onkeyup=e=>keys[e.key]=false;c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();keys[e.clientX<r.left+r.width/2?'ArrowLeft':'ArrowRight']=true});c.addEventListener('pointerup',()=>{keys.ArrowLeft=keys.ArrowRight=false});
function rect(o,color){x.fillStyle=color;x.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h)}
function loop(){if(!running)return;frame++;x.clearRect(0,0,900,560);x.fillStyle='#101a27';x.fillRect(0,0,900,560);x.fillStyle='#263745';x.fillRect(220,0,460,560);x.strokeStyle='#5df6ff';x.lineWidth=3;x.setLineDash([30,24]);x.lineDashOffset=-frame*speed;x.beginPath();x.moveTo(450,0);x.lineTo(450,560);x.stroke();x.setLineDash([]);
if(keys.ArrowLeft)player.x-=6;if(keys.ArrowRight)player.x+=6;if(keys.ArrowUp)speed=Math.min(9,speed+.07);else speed=Math.max(4,speed-.025);player.x=Math.max(250,Math.min(650,player.x));
if(frame%Math.max(22,Math.floor(54-speed*3))===0)things.push({x:275+Math.random()*350,y:-40,w:34,h:56,type:Math.random()<.25?'orb':'car',lane:0});
for(const t of things){t.y+=speed+(t.type==='car'?1:0);if(t.type==='orb'){x.fillStyle='#5df6ff';x.shadowBlur=18;x.shadowColor='#5df6ff';x.beginPath();x.arc(t.x,t.y,11,0,Math.PI*2);x.fill();x.shadowBlur=0;if(Math.abs(t.x-player.x)<24&&Math.abs(t.y-player.y)<30){t.y=700;score+=100}}else{rect(t,'#ff3f83');x.fillStyle='#ffc1d6';x.fillRect(t.x-11,t.y-18,22,9);if(Math.abs(t.x-player.x)<32&&Math.abs(t.y-player.y)<50){running=false;over=true}}}
things=things.filter(t=>t.y<620);rect(player,'#5df6ff');x.fillStyle='#10212d';x.fillRect(player.x-11,player.y-18,22,18);score+=1;scoreEl.textContent=score;if(over){x.fillStyle='#050814cc';x.fillRect(0,0,900,560);x.textAlign='center';x.fillStyle='#ff5a91';x.font='bold 48px system-ui';x.fillText('CRASHED!',450,250);x.fillStyle='white';x.font='22px system-ui';x.fillText('Press Start / Restart to race again',450,295);if(score>best){best=score;localStorage.ndBest=best;bestEl.textContent=best}return}requestAnimationFrame(loop)}
function idle(){x.fillStyle='#101a27';x.fillRect(0,0,900,560);x.fillStyle='#263745';x.fillRect(220,0,460,560);x.strokeStyle='#5df6ff';x.setLineDash([30,24]);x.beginPath();x.moveTo(450,0);x.lineTo(450,560);x.stroke();x.setLineDash([]);x.fillStyle='#5df6ff';x.textAlign='center';x.font='bold 42px system-ui';x.fillText('READY TO DRIFT?',450,250);x.font='20px system-ui';x.fillText('Press Start / Restart',450,292)}idle();
</script></body></html>
